# Toda la configuración sensible llega por variables de entorno (T016). No hay secretos en el código.
server:
  port: ${APP_PORT:8081}

spring:
  application:
    name: seasharem1
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/seashare}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # el esquema lo crea Flyway; Hibernate solo lo valida
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_SIZE_MB:10}MB # Spring limita por defecto a 1 MB
      max-request-size: -1 # el límite de 10 MB se aplica a cada archivo; los demás campos son texto corto

app:
  jwt:
    secret: ${JWT_SECRET} # sin valor por defecto: debe definirse en cada entorno
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:30}
  m2:
    # URL base del Módulo 2 (sin valor por defecto). Vacía = no se envían avisos de mantenimiento.
    base-url: ${M2_BASE_URL:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}

logging:
  level:
    root: INFO
    com.seashare: INFO
  pattern:
    # Cada línea lleva el correlation_id de la petición para rastrear un error de punta a punta
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{correlation_id:-sin-id}] %logger{36} - %msg%n"
